# A behaviour: no process, just SKILL.md, whose body the node adds to its agents' wake prompts.

[extension]
id = "karpathy"
name = "Karpathy rules"
version = "0.4.0"
node = ">=0.2.0"
publisher = "jamescalam"
summary = "Read and ask who knows, push back, stop on surprises, small diffs, only your part, checked steps, evidence, own your handoffs."

[behavior]
skill = "SKILL.md"
clients = ["claude", "codex", "gemini"]
